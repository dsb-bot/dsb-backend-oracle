[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsb-backend-oracle"
version = "0.1.0"
description = "DSB schedule backend with priority-aware SQLite storage and a read-only API"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "lxml>=5,<7",
    "python-dotenv>=1,<2",
    "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["dsb_bot*"]

[tool.setuptools.package-data]
dsb_bot = ["templates/*.html"]
